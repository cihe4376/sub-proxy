name: 生成订阅

on:
  schedule:
    - cron: "*/30 * * * *"   # 每30分钟更新一次
  workflow_dispatch:          # 允许手动触发

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        
      - name: 拉取并注入证书指纹
        run: |
          python3 -c "
          import base64, urllib.request
          
          url = 'https://hl.zmglqtdbkr.com/jiqun/4ba51022987b3aad7b0da9837f97e1ae'
          fp = '71A78C9C6EDF72959760FF3CD6EA247538A1371D403D6EC36D94EFC0641A7A06'
          
          req = urllib.request.Request(url, headers={'User-Agent': 'v2rayN/7.0'})
          resp = urllib.request.urlopen(req, timeout=20)
          raw = resp.read().decode().strip()
          
          decoded = base64.b64decode(raw).decode()
          decoded = decoded.replace('allowInsecure=1', f'pinnedPeerCertSha256={fp}')
          modified = base64.b64encode(decoded.encode()).decode()
          
          with open('sub.txt', 'w') as f:
              f.write(modified)
          
          with open('sub_decoded.txt', 'w') as f:
              f.write(decoded)
          
          print(f'节点数: {len(decoded.strip().split(chr(10)))}')
          print(f'含 pinnedPeerCertSha256: {decoded.count(\"pinnedPeerCertSha256\")}')
          print(f'含 allowInsecure 残留: {decoded.count(\"allowInsecure\") - decoded.count(\"pinnedPeerCertSha256\")}')
          "
      
      - name: 提交更新
        run: |
          git config user.name "bot"
          git config user.email "bot@github.com"
          git add sub.txt sub_decoded.txt
          git diff --staged --quiet || (git commit -m "更新订阅 $(date +%Y-%m-%d_%H:%M)" && git push)
