name: 生成订阅

on:
  schedule:
    - cron: "0 */2 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 拉取并注入证书指纹
        run: |
          python3 -c "
          import base64, urllib.request

          url = 'https://hl.zmglqtdbkr.com/jiqun/4ba51022987b3aad7b0da9837f97e1ae'
          fp = '71A78C9C6EDF72959760FF3CD6EA247538A1371D403D6EC36D94EFC0641A7A06'

          req = urllib.request.Request(url, headers={'User-Agent': 'v2rayN/7.0'})
          resp = urllib.request.urlopen(req, timeout=20)
          raw = resp.read().decode().strip()

          decoded = base64.b64decode(raw).decode()
          decoded = decoded.replace('allowInsecure=1', f'pcs={fp}')
          modified = base64.b64encode(decoded.encode()).decode()

          with open('sub.txt', 'w') as f:
              f.write(modified)

          print(f'节点数: {len(decoded.strip().split(chr(10)))}')
          print(f'含 pinnedPeerCertSha256: {decoded.count(\"pinnedPeerCertSha256\")}')
          "

      - name: 提交更新
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add sub.txt
          if git diff --staged --quiet; then
            echo "无变化，跳过提交"
          else
            git commit -m "更新订阅 $(TZ=Asia/Shanghai date +%Y-%m-%d_%H:%M)"
            git push
          fi
