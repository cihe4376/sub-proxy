name: 生成订阅

on:
  schedule:
    - cron: "0 */2 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 拉取并注入证书指纹
        run: |
          python3 -c "
          import base64, urllib.request

          url = 'https://hl.zmglqtdbkr.com/jiqun/4ba51022987b3aad7b0da9837f97e1ae'
          fp = '71A78C9C6EDF72959760FF3CD6EA247538A1371D403D6EC36D94EFC0641A7A06'

          req = urllib.request.Request(url, headers={'User-Agent': 'v2rayN/7.0'})
          resp = urllib.request.urlopen(req, timeout=20)
          raw = resp.read().decode().strip()

          decoded = base64.b64decode(raw).decode()
          decoded = decoded.replace('allowInsecure=1', f'pcs={fp}')
          modified = base64.b64encode(decoded.encode()).decode()

          with open('sub.txt', 'w') as f:
              f.write(modified)

          print(f'节点数: {len(decoded.strip().split(chr(10)))}')
          print(f'pcs 注入数: {decoded.count(\"pcs=\")}')
          "

      - name: 提交到 output 分支 (仅保留最新版本)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # 切到孤儿分支 output，没有历史记录
          git checkout --orphan output
          git add sub.txt
          git commit -m "订阅快照 $(TZ=Asia/Shanghai date +%Y-%m-%d_%H:%M)"

          # 强制推送，output 分支永远只有 1 个 commit
          git push origin output --force
